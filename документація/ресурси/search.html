<script>
  const searchData = JSON.parse("[{\"title\":\"ЛіМавка\",\"content\":\"# ЛіМавка\\n\\n<a href=\\\"./ресурси/тема/photo.jpg\\\"><img src=\\\"./ресурси/тема/photo_comressed.jpg\\\"></a>\\n\\nЛіМавка це прошивка на основі [KeiraOS](https://github.com/lilka-dev/keira) з підтримкою української мови програмування [Мавка](https://мавка.укр) для української саморобної консолі [Лілка](https://lilka.dev).\\n\\nЛіМавка надає можливість писати програми для Лілки повністю українською мовою!\\n\\nПосилання:\\n\\n- [Встановити ЛіМавку](./встановити.html)\\n\\n- [Приклад програми Мавкою](./приклад-програми-мавкою.html)\\n\\n- [GitHub ЛіМавки](https://github.com/mavka-ukr/limavka)\\n\",\"path\":\"index.html\"},{\"title\":\"Встановити | ЛіМавка\",\"content\":\"# Встановити ЛіМавку\\n\\n<div id=\\\"releases\\\"></div>\\n\",\"path\":\"встановити.html\"},{\"title\":\"Приклад програми Мавкою | ЛіМавка\",\"content\":\"# Приклад програми Мавкою\\n\\n```мавка\\nкольори = [\\n  Колір.БІЛИЙ,\\n  Колір.ЧЕРВОНИЙ,\\n  Колір.ЗЕЛЕНИЙ,\\n  Колір.СИНІЙ,\\n]\\n\\nікс = Полотно.Ш/2\\nігр = Полотно.В/2\\nр = 20\\nпк = 0\\nколір = кольори[пк]\\nшв = 50\\n\\nзапущено = дійсне\\nост_ч = отримати_час()\\n\\nкнс_ч = отримати_час()\\nкіл_кдр = 0\\nпот_кнс = 0\\n\\nпоки запущено\\n  пот_ч = отримати_час()\\n\\n  різ_ч = пот_ч - ост_ч\\n  ост_ч = пот_ч\\n\\n\\n  оновити_кнопки() ;; оновити стан кнопок\\n\\n  якщо Кнопки.вверх.нажато\\n    ігр -= (шв * (різ_ч / 1000))\\n  кінець\\n  якщо Кнопки.вниз.нажато\\n    ігр += (шв * (різ_ч / 1000))\\n  кінець\\n  якщо Кнопки.вліво.нажато\\n    ікс -= (шв * (різ_ч / 1000))\\n  кінець\\n  якщо Кнопки.вправо.нажато\\n    ікс += (шв * (різ_ч / 1000))\\n  кінець\\n\\n  якщо Кнопки.а.нажато\\n    р += (шв * (різ_ч / 1000))\\n  кінець\\n  якщо Кнопки.д.нажато\\n    р -= (шв * (різ_ч / 1000))\\n  кінець\\n\\n  якщо Кнопки.г.щойно_нажато\\n    пк += 1\\n    якщо пк == кольори.довжина\\n      пк = 0\\n    кінець\\n\\n    колір = кольори[пк]\\n  кінець\\n\\n  якщо Кнопки.б.щойно_відпущено\\n    запущено = недійсне\\n  кінець\\n\\n\\n  Полотно.заповнити(0)\\n  Полотно.круг(ікс, ігр, р, колір)\\n\\n  кіл_кдр += 1\\n  якщо (пот_ч - кнс_ч) >= 1000\\n    пот_кнс = кіл_кдр\\n    кіл_кдр = 0\\n    кнс_ч = пот_ч\\n  кінець\\n\\n  Полотно.текст(30, 30, Текст(пот_кнс), розмір=3, колір=Колір.ЧЕРВОНИЙ)\\n\\n  Полотно.відмалювати() ;; запланувати відмалювання\\n\\n  ч_обр = отримати_час() - пот_ч\\n  трв_кдр = 1000.0 / Полотно.КНС\\n\\n  якщо ч_обр < трв_кдр\\n    спати(трв_кдр - ч_обр)\\n  кінець\\nкінець\\n```\\n\",\"path\":\"приклад-програми-мавкою.html\"},{\"title\":\"Полотно | ЛіМавка\",\"content\":\"# Полотно\\n\\n```мавка\\nПолотно.заповнити(Колір.ЧОРНИЙ)\\n\\nПолотно.круг(50, 50, 30, Колір.ЧЕРВОНИЙ)\\n\\nПолотно.відмалювати()\\n```\\n\\n---\\n\\n### `Полотно.Ш`\\n\\nШирина полотна (pixels).\\n\\n### `Полотно.В`\\n\\nВисота полотна (pixels).\\n\\n### `Полотно.колір565(ч, з, с)`\\n\\nКонвертує колір з формату RGB888 (0–255) у RGB565. Вертає число (колір у форматі RGB565).\\n\\n### `Полотно.відмалювати()`\\n\\nПередає полотно на відмалювання.\\n\\n### `Полотно.заповнити(колір)`\\n\\nЗаповнює полотно вказаним кольором.\\n\\n### `Полотно.точка(ікс, ігр, колір)`\\n\\nМалює точку (pixel) за координатами (`ікс`, `ігр`) заданим кольором.\\n\\n### `Полотно.лінія(ікс0, ігр0, ікс1, ігр1, колір)`\\n\\nМалює лінію від координати (`ікс0`, `ігр0`) до (`ікс1`, `ігр1`) заданим кольором.\\n\\n### `Полотно.прямокут(ікс, ігр, вис, шир, колір)`\\n\\nМалює прямокутник (`ікс`, `ігр`, висота `вис`, ширина `шир`, колір).\\n\\n### `Полотно.впрямокут(ікс, ігр, вис, шир, колір)`\\n\\nМалює заповнений прямокутник (`ікс`, `ігр`, висота `вис`, ширина `шир`, колір).\\n\\n### `Полотно.трикут(ікс0, ігр0, ікс1, ігр1, ікс2, ігр2, колір)`\\n\\nМалює трикутник за координатами трьох вершин (`ікс0`, `ігр0`, `ікс1`, `ігр1`, `ікс2`, `ігр2`) та кольором.\\n\\n### `Полотно.втрикут(ікс0, ігр0, ікс1, ігр1, ікс2, ігр2, колір)`\\n\\nМалює заповнений трикутник за координатами трьох вершин (`ікс0`, `ігр0`, `ікс1`, `ігр1`, `ікс2`, `ігр2`) та кольором.\\n\\n### `Полотно.коло(ікс, ігр, р, колір)`\\n\\nМалює коло (центр `ікс`, `ігр`, радіус `р`, колір).\\n\\n### `Полотно.круг(ікс, ігр, р, колір)`\\n\\nМалює заповнене коло (центр `ікс`, `ігр`, радіус `р`, колір).\\n\\n### `Полотно.еліпс(ікс, ігр, рікс, рігр, колір)`\\n\\nМалює еліпс (центр `ікс`, `ігр`, радіуси `рікс`, `рігр`, колір).\\n\\n### `Полотно.веліпс(ікс, ігр, рікс, рігр, колір)`\\n\\nМалює заповнений еліпс (центр `ікс`, `ігр`, радіуси `рікс`, `рігр`, колір).\\n\\n### `Полотно.дуга(ікс, ігр, р1, р2, пк, кк, колір)`\\n\\nМалює дугу (центр `ікс`, `ігр`, радіуси `р1`, `р2`, кути `пк`, `кк`, колір).\\n\\n### `Полотно.вдуга(ікс, ігр, р, пк, кк, колір)`\\n\\nМалює заповнену дугу (центр `ікс`, `ігр`, радіус `р`, кути `пк`, `кк`, колір).\\n\\n### `Полотно.текст(ікс, ігр, значення, шрифт, розмір, колір)`\\n\\nВиводить текст на полотні (координати `ікс`, `ігр`, текст `значення`, `шрифт`, `розмір`, `колір`).\\n\\nДоступні шрифти: `4х6`, `5х7`, `5х8`, `6х12`, `6х13`, `7х13`, `8х13`, `9х15`, `10х20`.\\n\",\"path\":\"мавка-Полотно.html\"},{\"title\":\"Кнопки | ЛіМавка\",\"content\":\"\",\"path\":\"мавка-Кнопки.html\"},{\"title\":\"Колір | ЛіМавка\",\"content\":\"\",\"path\":\"мавка-Колір.html\"}]");

  window.addEventListener("message", (event) => {
    const eventData = event.data;
    const eventId = eventData.id;
    const eventType = eventData.type;
    if (eventType === "search") {
      const query = eventData.query;
      const results = searchData.filter((item) => {
        return item.title.toLowerCase().includes(query.toLowerCase());
      });
      window.parent.postMessage(
        {
          id: eventId,
          result: results
        },
        "*"
      );
    }
  });
</script>
